<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent Ecosystem</title>
  <desc id="desc">A portable system connecting skills, agents, rules, and models to Codex, Claude, Gemini, Koda, and SourceCraft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61e7ff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#61e7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a9b4c7" stroke-opacity=".055"/>
      <circle cx="0" cy="0" r="1" fill="#a9b4c7" fill-opacity=".13"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#61e7ff"/><stop offset="1" stop-color="#61e7ff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="violetLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b7cff"/><stop offset="1" stop-color="#8b7cff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#55e6a5"/><stop offset="1" stop-color="#55e6a5" stop-opacity=".45"/>
    </linearGradient>
    <style>
      .title{font:800 74px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-2px;fill:#f5f7fb}
      .subtitle{font:450 27px Inter,ui-sans-serif,system-ui,sans-serif;fill:#a9b4c7}
      .node{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#f5f7fb;text-anchor:middle}
      .host{font:650 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f5f7fb}
      .route{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="640" rx="22" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="22" fill="url(#grid)"/>
  <ellipse cx="833" cy="320" rx="360" ry="285" fill="url(#hub)"/>
  <path d="M40 90H330M40 550H410M1260 82H1560M1200 558H1560" stroke="#61e7ff" stroke-opacity=".09"/>

  <text class="title" x="78" y="208">AGENT</text>
  <text class="title" x="78" y="290">ECOSYSTEM</text>
  <path d="M80 333H192" stroke="#ffca68" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="333" r="5" fill="#ffca68" filter="url(#glow)"/>
  <text class="subtitle" x="78" y="390">One portable system. Any agent.</text>
  <text class="subtitle" x="78" y="430">Only what you need.</text>

  <g class="route">
    <path d="M674 183L735 244" stroke="url(#cyanLine)"/>
    <path d="M674 457L735 396" stroke="url(#violetLine)"/>
    <path d="M890 244L950 183" stroke="url(#greenLine)"/>
    <path d="M890 396L950 457" stroke="url(#greenLine)"/>
    <path d="M1058 183H1100Q1125 183 1125 158V118Q1125 96 1147 96H1260" stroke="url(#cyanLine)"/>
    <path d="M1058 183H1115Q1140 183 1140 208V218Q1140 240 1162 240H1260" stroke="url(#violetLine)"/>
    <path d="M1058 320H1260" stroke="url(#cyanLine)"/>
    <path d="M1058 457H1115Q1140 457 1140 432V422Q1140 400 1162 400H1260" stroke="url(#greenLine)"/>
    <path d="M1058 457H1100Q1125 457 1125 482V522Q1125 544 1147 544H1260" stroke="#ffca68" stroke-opacity=".78"/>
  </g>

  <g transform="translate(570 122)">
    <rect width="108" height="108" rx="27" fill="#0b1f30" stroke="#61e7ff" stroke-width="2"/>
    <rect x="8" y="8" width="92" height="92" rx="21" fill="none" stroke="#61e7ff" stroke-opacity=".35"/>
    <circle cx="54" cy="39" r="8" fill="none" stroke="#61e7ff" stroke-width="3"/>
    <path d="M54 47V57M38 68L54 57 70 68" fill="none" stroke="#61e7ff" stroke-width="3" stroke-linecap="round"/>
    <text class="node" x="54" y="91">SKILLS</text>
  </g>
  <g transform="translate(570 410)">
    <rect width="108" height="108" rx="27" fill="#141432" stroke="#8b7cff" stroke-width="2"/>
    <rect x="8" y="8" width="92" height="92" rx="21" fill="none" stroke="#8b7cff" stroke-opacity=".35"/>
    <circle cx="45" cy="38" r="9" fill="none" stroke="#8b7cff" stroke-width="3"/>
    <circle cx="64" cy="42" r="7" fill="none" stroke="#8b7cff" stroke-width="3"/>
    <path d="M29 66Q45 54 61 66M56 68Q68 59 79 70" fill="none" stroke="#8b7cff" stroke-width="3" stroke-linecap="round"/>
    <text class="node" x="54" y="92">AGENTS</text>
  </g>
  <g transform="translate(786 266)">
    <rect width="108" height="108" rx="27" fill="#102a27" stroke="#55e6a5" stroke-width="2"/>
    <rect x="8" y="8" width="92" height="92" rx="21" fill="none" stroke="#55e6a5" stroke-opacity=".35"/>
    <path d="M54 27L75 35V51Q75 69 54 77Q33 69 33 51V35Z" fill="none" stroke="#55e6a5" stroke-width="3"/>
    <path d="M45 44H63M45 54H63" stroke="#55e6a5" stroke-width="3" stroke-linecap="round"/>
    <text class="node" x="54" y="96">RULES</text>
  </g>
  <g transform="translate(946 410)">
    <rect width="108" height="108" rx="27" fill="#101b35" stroke="#6e8cff" stroke-width="2"/>
    <rect x="8" y="8" width="92" height="92" rx="21" fill="none" stroke="#6e8cff" stroke-opacity=".35"/>
    <path d="M54 27L74 38V61L54 73 34 61V38Z" fill="none" stroke="#6e8cff" stroke-width="3"/>
    <path d="M34 38L54 50 74 38M54 50V73" fill="none" stroke="#6e8cff" stroke-width="3"/>
    <text class="node" x="54" y="96">MODELS</text>
  </g>

  <g>
    <g transform="translate(1260 61)"><rect width="270" height="70" rx="19" fill="#0b1b2b" stroke="#61e7ff" stroke-width="2"/><circle cx="34" cy="35" r="6" fill="#61e7ff" filter="url(#glow)"/><text class="host" x="58" y="43">Codex</text></g>
    <g transform="translate(1260 205)"><rect width="270" height="70" rx="19" fill="#15142b" stroke="#8b7cff" stroke-width="2"/><circle cx="34" cy="35" r="6" fill="#8b7cff" filter="url(#glow)"/><text class="host" x="58" y="43">Claude</text></g>
    <g transform="translate(1260 285)"><rect width="270" height="70" rx="19" fill="#0d1d31" stroke="#61b7ff" stroke-width="2"/><circle cx="34" cy="35" r="6" fill="#61b7ff" filter="url(#glow)"/><text class="host" x="58" y="43">Gemini</text></g>
    <g transform="translate(1260 365)"><rect width="270" height="70" rx="19" fill="#0d2723" stroke="#55e6a5" stroke-width="2"/><circle cx="34" cy="35" r="6" fill="#55e6a5" filter="url(#glow)"/><text class="host" x="58" y="43">Koda</text></g>
    <g transform="translate(1260 509)"><rect width="270" height="70" rx="19" fill="#2a2110" stroke="#ffca68" stroke-width="2"/><circle cx="34" cy="35" r="6" fill="#ffca68" filter="url(#glow)"/><text class="host" x="58" y="43">SourceCraft</text></g>
  </g>
</svg>
